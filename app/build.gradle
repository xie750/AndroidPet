plugins {
    id "com.android.application"
}

def assistantEndpoint = providers.gradleProperty("FEIWU_ASSISTANT_ENDPOINT").orElse("").get()
def assistantClientToken = providers.gradleProperty("FEIWU_ASSISTANT_CLIENT_TOKEN").orElse("").get()
def javaString = { value -> "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\"" }

android {
    namespace "com.example.desktoppet"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.desktoppet"
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName "0.12.0"
        testInstrumentationRunner "com.example.desktoppet.feature.pet.PetMotionCheck"
        buildConfigField "String", "ASSISTANT_ENDPOINT", javaString(assistantEndpoint)
        buildConfigField "String", "ASSISTANT_CLIENT_TOKEN", javaString(assistantClientToken)
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    implementation "net.java.dev.jna:jna:5.18.1@aar"
}
